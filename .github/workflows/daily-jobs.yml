
name: Daily Job Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scout
        run: python job_scout.py

      - name: Copy generated jobs to website
        run: |
          test -f data/jobs.json
          cp data/jobs.json jobs.json

      - name: Save generated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json data/jobs.json data/jobs.csv data/source_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update job listings"
            git push
          fi


name: Daily Procurement Job Scout

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job search
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python job_scout.py
